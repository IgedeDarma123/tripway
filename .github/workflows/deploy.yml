name: Deploy to Niagahoster

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare translation files
        run: |
          # strip UTF-8 BOM (PHP json_decode rejects a leading BOM)
          find lang -name '*.json' -print0 | xargs -0 -r sed -i '1s/^\xEF\xBB\xBF//'

          # validate translation JSON early
          if command -v jq >/dev/null 2>&1; then
            find lang -name '*.json' -exec jq empty {} + || { echo "INVALID TRANSLATION JSON"; exit 1; }
          fi

          # make sure the committed Vite build exists for the standard layout
          test -f public/build/manifest.json || { echo "MISSING public/build/manifest.json"; exit 1; }

      - name: Sync files to server
        run: |
          # Deploy the standard Laravel layout. Hostinger serves the repository
          # root as the web root, so root index.php + .htaccess make it work
          # regardless of whether our deploy or Hostinger's own deploy wins.
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='storage' \
            --exclude='vendor' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='bootstrap/cache' \
            --exclude='public/storage' \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/u966953872/domains/tripwaytour.com/public_html/

      - name: Server-side commands
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/u966953872/domains/tripwaytour.com/public_html

            echo "=== Wait for deploy files to settle ==="
            # Hostinger may also deploy the repository on push; wait for a
            # consistent checkout before running commands.
            for i in $(seq 1 20); do
              [ -f artisan ] && [ -f composer.json ] && break
              echo "waiting for application files ($i)..."
              sleep 2
            done
            [ -f artisan ] || { echo "artisan missing after waiting"; exit 1; }

            echo "=== Remove temporary probes ==="
            rm -f zz_rootprobe.txt zz_pubprobe.txt zzpr_*.txt public/zzpr_*.txt 2>/dev/null || true
            rm -f /home/u966953872/domains/tripwaytour.com/.builds/zzpr_*.txt 2>/dev/null || true

            echo "=== Permissions ==="
            mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
            rm -rf bootstrap/cache
            mkdir -p bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            echo "=== Composer ==="
            composer install --no-dev --optimize-autoloader --no-interaction --no-scripts 2>&1 || { echo "COMPOSER INSTALL FAILED"; exit 1; }

            echo "=== Reset bootstrap cache before discovery ==="
            rm -rf bootstrap/cache
            mkdir -p bootstrap/cache
            chmod -R 775 bootstrap/cache
            ls -la bootstrap/cache

            echo "=== Package discovery ==="
            for i in 1 2 3; do
              rm -rf bootstrap/cache
              mkdir -p bootstrap/cache
              php artisan package:discover --ansi 2>&1 && break
              echo "package:discover failed, retrying ($i)..."
              sleep 5
            done
            if [ ! -f bootstrap/cache/packages.php ]; then
              rm -rf bootstrap/cache
              mkdir -p bootstrap/cache
            fi

            echo "=== Migrate ==="
            php artisan migrate --force 2>&1 || echo "Migrate skipped"

            echo "=== Seed ==="
            php artisan db:seed --class=PaymentSettingsSeeder --force 2>&1 || echo "Seed skipped"
            php artisan db:seed --class=SettingsSeeder --force 2>&1 || echo "Seed settings skipped"

            echo "=== Update MAIL_PASSWORD in .env ==="
            MAIL_PASSWORD_CLEAN="${{ secrets.MAIL_PASSWORD }}"
            MAIL_PASSWORD_CLEAN=$(printf '%s' "$MAIL_PASSWORD_CLEAN" | tr -d '[:space:]')
            MAIL_PASSWORD_SED=$(printf '%s' "$MAIL_PASSWORD_CLEAN" | sed -e 's/[\\&|]/\\&/g')
            if grep -q '^MAIL_PASSWORD=' .env; then
              sed -i "s|^MAIL_PASSWORD=.*|MAIL_PASSWORD=$MAIL_PASSWORD_SED|" .env
            else
              echo "MAIL_PASSWORD=$MAIL_PASSWORD_CLEAN" >> .env
            fi

            echo "=== Cache ==="
            php artisan optimize:clear 2>&1 || true
            php artisan package:discover --ansi 2>&1 || true
            php artisan config:cache 2>&1 || true
            php artisan view:cache 2>&1 || true

            echo "=== Storage Link ==="
            php artisan storage:link 2>&1 || true

            echo "=== DEPLOY SUCCESS ==="

      - name: Verify live site
        if: success()
        run: |
          sleep 20
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 https://tripwaytour.com/ || echo "000")
            echo "live check $i: / -> HTTP $code"
            sleep 30
          done

          for path in "/tours" "/build/manifest.json" "/favicon.ico"; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://tripwaytour.com${path}" || echo "000")
            echo "${path} -> HTTP ${code}"
          done

          # exercise the en locale (catches BOM / invalid lang JSON 500s)
          curl -sS -c cookies.txt -b cookies.txt -L -o /dev/null -w "language/en -> HTTP %{http_code}\n" --max-time 20 https://tripwaytour.com/language/en || true
          curl -sS -c cookies.txt -b cookies.txt -L -o /dev/null -w "home with en cookie -> HTTP %{http_code}\n" --max-time 20 https://tripwaytour.com/ || true

      - name: Deployment status
        if: failure()
        run: echo "::error::Deploy gagal. Cek log step di atas untuk detail error."
