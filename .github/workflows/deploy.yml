name: Deploy to Niagahoster

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Flatten structure for server
        run: |
          SERVER_PATH="$HOME/domains/tripwaytour.com/public_html"

          # prepare temp dir with flattened structure
          rm -rf /tmp/deploy
          mkdir -p /tmp/deploy

          # copy everything from repo (excluding .git, public/)
          rsync -a \
            --exclude='.git' \
            --exclude='public' \
            --exclude='bootstrap/cache' \
            --exclude='storage' \
            . /tmp/deploy/

          # copy public/ contents to root (overwrite index.php, .htaccess, build/, etc.)
          rsync -a public/ /tmp/deploy/

          # fix index.php paths: remove ../ since everything is at same level
          sed -i \
            -e "s|__DIR__.'/\.\./vendor/|__DIR__.'/vendor/|g" \
            -e "s|__DIR__.'/\.\./bootstrap/|__DIR__.'/bootstrap/|g" \
            -e "s|__DIR__.'/\.\./storage/|__DIR__.'/storage/|g" \
            /tmp/deploy/index.php

      - name: Sync files to server
        run: |
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='storage' \
            --exclude='vendor' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='bootstrap/cache' \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            /tmp/deploy/ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/u966953872/domains/tripwaytour.com/public_html/

      - name: Server-side commands
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/u966953872/domains/tripwaytour.com/public_html

            echo "=== Docroot diagnostics ==="
            echo "PWD: $(pwd)"
            echo "WHOAMI: $(whoami)"
            echo "--- current dir ---"
            ls -la | head -40
            echo "--- home ---"
            ls -la /home/u966953872 2>&1 | head -40
            echo "--- domains ---"
            ls -la /home/u966953872/domains 2>&1 | head -40
            echo "--- index.php candidates ---"
            find /home/u966953872 -maxdepth 4 -name index.php 2>/dev/null | head -30
            echo "--- public_html candidates ---"
            ls -la /home/u966953872/public_html 2>&1 | head -40
            echo "--- .htaccess in cwd ---"
            [ -f .htaccess ] && cat .htaccess || echo "no .htaccess in cwd"
            echo "--- domain dir ---"
            ls -la /home/u966953872/domains/tripwaytour.com 2>&1 | head -30
            echo "--- root / public probes ---"
            echo "root-probe $(date -u)" > zz_rootprobe.txt
            mkdir -p public
            echo "public-probe $(date -u)" > public/zz_pubprobe.txt
            ls -la zz_rootprobe.txt public/zz_pubprobe.txt
            echo "--- default 404/index pages ---"
            find /home/u966953872 -maxdepth 4 \( -name '404.html' -o -name '404.shtml' -o -name 'index.html' \) -printf '%TY-%Tm-%Td %p\n' 2>/dev/null | head -20
            echo "--- vhost docroot config ---"
            grep -rs "tripwaytour.com" /etc/apache2/conf.d /usr/local/lsws/conf 2>/dev/null | head -20 || echo "config not readable"
            echo "--- HTTP check from server ---"
            curl -skI --max-time 15 https://tripwaytour.com 2>&1 | head -20
            echo "--- server public IP (obfuscated to bypass masking) ---"
            SRV_IP=$(curl -s --max-time 10 https://api.ipify.org 2>&1)
            echo "IP_DASHED: $(printf '%s' "$SRV_IP" | tr '.' '-')"
            echo "--- server public IPv6 ---"
            SRV_IP6=$(curl -s -6 --max-time 10 https://api64.ipify.org 2>&1 || true)
            echo "IP6_DASHED: $(printf '%s' "$SRV_IP6" | tr ':' '-')"
            echo "--- server resolves domain to ---"
            getent hosts tripwaytour.com 2>&1 || true
            echo "--- local vhost via 127.0.0.1 ---"
            curl -skI --max-time 10 --resolve tripwaytour.com:443:127.0.0.1 https://tripwaytour.com 2>&1 | head -8

            echo "=== Permissions ==="
            mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
            rm -rf bootstrap/cache
            mkdir -p bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            echo "=== Composer ==="
            composer install --no-dev --optimize-autoloader --no-interaction --no-scripts 2>&1 || { echo "COMPOSER INSTALL FAILED"; exit 1; }

            echo "=== Reset bootstrap cache before discovery ==="
            rm -rf bootstrap/cache
            mkdir -p bootstrap/cache
            chmod -R 775 bootstrap/cache
            ls -la bootstrap/cache

            echo "=== Package discovery ==="
            php artisan package:discover --ansi 2>&1 || { echo "PACKAGE DISCOVER FAILED"; exit 1; }

            echo "=== Migrate ==="
            php artisan migrate --force 2>&1 || echo "Migrate skipped"

            echo "=== Seed ==="
            php artisan db:seed --class=PaymentSettingsSeeder --force 2>&1 || echo "Seed skipped"
            php artisan db:seed --class=SettingsSeeder --force 2>&1 || echo "Seed settings skipped"

            echo "=== Update MAIL_PASSWORD in .env ==="
            MAIL_PASSWORD_CLEAN="${{ secrets.MAIL_PASSWORD }}"
            MAIL_PASSWORD_CLEAN=$(printf '%s' "$MAIL_PASSWORD_CLEAN" | tr -d '[:space:]')
            MAIL_PASSWORD_SED=$(printf '%s' "$MAIL_PASSWORD_CLEAN" | sed -e 's/[\\&|]/\\&/g')
            if grep -q '^MAIL_PASSWORD=' .env; then
              sed -i "s|^MAIL_PASSWORD=.*|MAIL_PASSWORD=$MAIL_PASSWORD_SED|" .env
            else
              echo "MAIL_PASSWORD=$MAIL_PASSWORD_CLEAN" >> .env
            fi

            echo "=== Cache ==="
            php artisan optimize:clear 2>&1 || true
            php artisan package:discover --ansi 2>&1 || true
            php artisan config:cache 2>&1 || true
            php artisan view:cache 2>&1 || true

            echo "=== Storage Link ==="
            php artisan storage:link 2>&1 || true

            echo "=== DEPLOY SUCCESS ==="

      - name: Deployment status
        if: failure()
        run: echo "::error::Deploy gagal. Cek log step di atas untuk detail error."
